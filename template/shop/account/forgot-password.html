{% extends 'base.html' %}

{% block title %}<title>Forgot Password</title>{% endblock %}

{% block container %}
<main>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="text-center mb-5">
          <h1 class="fw-bold h2">Forgot Password</h1>
        </div>

        <form id="forgotPasswordForm" onsubmit="return false;">
          <div class="form-floating mb-3">
            <input type="email" name="email" class="form-control border-dark" id="loginEmail" placeholder="name@example.com" required>
            <label for="loginEmail">Email</label>
          </div>
          <div class="d-grid gap-3 mb-4">
            <button type="submit" class="btn btn-dark py-3">Next</button>
            <a href="{% system with name='BaseUrl' %}/login" class="text-center text-dark small text-decoration-underline">Back to Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
{% endblock %}
